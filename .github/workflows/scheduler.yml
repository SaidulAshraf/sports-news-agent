# This is the name of the workflow, which you will see in the Actions tab.
name: Daily Sports News Scraper

on:
  # This line allows you to run the workflow manually from the Actions tab.
  workflow_dispatch:

  # This line sets up the automated schedule to run at 8:00 AM Dhaka time.
  schedule:
    - cron: '0 2 * * *'

jobs:
  scrape-news:
    # Use a fresh virtual computer for our job
    runs-on: ubuntu-latest

    steps:
      # Step 1: Download your code onto the virtual computer
      - name: Check out repository
        uses: actions/checkout@v3

      # Step 2: Install Node.js environment
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      # Step 3: Install all required libraries from package.json
      - name: Install dependencies
        run: npm install

      # Step 4: Run the scraping script from the correct folder
      # THIS IS THE UPDATED LINE
      - name: Run scraping and summarization script
        run: node api/scrape.js
        env:
          # This passes your secrets to the script
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SCRAPINGBEE_API_KEY: ${{ secrets.SCRAPINGBEE_API_KEY }}
